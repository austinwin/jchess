services:
  - type: web
    name: jchess-academy
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jchess-postgres
          property: connectionString
      - key: DEMO_USERS
        value: "false"
      - key: ADMIN_USERNAME
        value: hoang
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_CHILD_PASSWORD
        sync: false
      - key: AI_ENCRYPTION_KEY
        generateValue: true
databases:
  - name: jchess-postgres
    plan: free
    region: ohio
